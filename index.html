
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!--
    ETAPA 2 - CELULAR (360px). Classes sem prefixo.
    Mantém a estrutura original do projeto.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Fundo escuro, texto claro e altura mínima da tela -->
<body class="bg-gray-900 text-slate-100 min-h-screen">

  <!-- Cabeçalho -->
  <header class="bg-purple-700 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">

      <h1 class="lg:text-3xl font-bold">EsToDoList</h1>

      <span class="hidden sm:inline font-bold text-sm">
        Organize sua rotina escolar
      </span>

    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 items-start gap-6">

    <!-- Coluna 1: pesquisar e filtrar -->
    <section class="min-w-0 bg-gray-800 rounded-xl shadow p-4 space-y-4">

      <!-- Campo de pesquisa -->
      <input
        type="search"
        placeholder="Pesquisar tarefa..."
        class="w-full min-w-0 border rounded-lg px-3 py-3 text-slate-800"
      >

      <!-- Filtros -->
      <div class="flex flex-wrap gap-2">

        <button class="px-3 py-3 rounded-full bg-purple-600 text-white">
          Todas
        </button>

        <button class="px-3 py-3 rounded-full bg-slate-200 text-slate-800">
          Pendentes
        </button>

        <button class="px-3 py-3 rounded-full bg-slate-200 text-slate-800">
          Concluídas
        </button>

      </div>
    </section>

    <!-- Coluna 2: lista de tarefas -->
    <section id="lista-tarefas" class="min-w-0 lg:col-span-2">

      <ul class="space-y-3">

        <!-- Primeira tarefa -->
        <li class="bg-gray-800 text-white rounded-xl shadow p-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between lg:flex-col lg:items-start">

          <label class="flex items-start gap-3 sm:flex-1 min-w-0">

            <input type="checkbox" class="mt-1 w-5 h-5 shrink-0">

            <span class="min-w-0">
              <span class="block font-medium">
                Trabalho de História
              </span>

              <span class="text-sm text-slate-400">
                20/10/2026
              </span>
            </span>

          </label>

          <div class="flex gap-2 sm:flex-none lg:self-end">

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-green-400 text-white hover:bg-green-500">
              Editar
            </button>

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-500 text-white hover:bg-red-600">
              Excluir
            </button>

          </div>
        </li>

        <!-- Segunda tarefa -->
        <li class="bg-gray-800 text-white rounded-xl shadow p-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between lg:flex-col lg:items-start">

          <label class="flex items-start gap-3 sm:flex-1 min-w-0">

            <input type="checkbox" class="mt-1 w-5 h-5 shrink-0">

            <span class="min-w-0">
              <span class="block font-medium">
                Estudar para a prova de Matemática
              </span>

              <span class="text-sm text-slate-400">
                22/10/2026
              </span>
            </span>

          </label>

          <div class="flex gap-2 sm:flex-none lg:self-end">

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-green-400 text-white hover:bg-green-500">
              Editar
            </button>

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-500 text-white hover:bg-red-600">
              Excluir
            </button>

          </div>
        </li>

        <!-- Terceira tarefa -->
        <li class="bg-gray-800 text-white rounded-xl shadow p-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between lg:flex-col lg:items-start">

          <label class="flex items-start gap-3 sm:flex-1 min-w-0">

            <input type="checkbox" checked class="mt-1 w-5 h-5 shrink-0">

            <span class="min-w-0">
              <span class="block font-medium">
                Entregar projeto no GitHub
              </span>

              <span class="text-sm text-slate-400">
                08/10/2026
              </span>
            </span>

          </label>

          <div class="flex gap-2 sm:flex-none lg:self-end">

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-green-400 text-white hover:bg-green-500">
              Editar
            </button>

            <button class="flex-1 sm:flex-none px-4 py-3 rounded-lg bg-red-500 text-white hover:bg-red-600">
              Excluir
            </button>

          </div>
        </li>

      </ul>

      <!-- Contador de tarefas -->
      <p class="mt-4 text-sm text-slate-400">
        2 tarefas pendentes
      </p>

    </section>

  </main>

  <!-- Botão para adicionar tarefa -->
  <a
    href="cadastro.html"
    aria-label="Adicionar tarefa"
    class="fixed bottom-5 right-5 flex h-14 w-14 items-center justify-center rounded-full bg-purple-600 text-3xl font-normal leading-none text-white shadow-lg hover:bg-purple-700"
  >
    +
  </a>

</body>
</html>
